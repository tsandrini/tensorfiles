[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evnia-panel"
version = "0.2.0"
description = "Keyboard-driven overlay panel and CLI for the Philips Evnia 32M2N8900P (raw DDC/CI incl. vendor sub-features + USB Ambiglow)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "tsandrini", email = "t@tsandrini.sh" }]
dependencies = ["PyGObject"]

[project.scripts]
evnia-panel = "evnia_panel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
