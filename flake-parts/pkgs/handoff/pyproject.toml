[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff"
version = "0.1.0"
description = "Carry dirty git working trees between machines through an encrypted rclone relay"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "tsandrini", email = "t@tsandrini.sh" }]

[project.scripts]
handoff = "handoff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.pytest.ini_options]
testpaths = ["tests"]
